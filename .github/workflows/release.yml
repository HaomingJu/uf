name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ARCHIVE="uf-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/uf uf
          tar czf "$ARCHIVE" uf
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            uf-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            uf-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  bump-homebrew:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
    steps:
      - name: Download all sha256 artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Extract sha256 values
        id: sha
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          SHA_MAC_ARM=$(awk '{print $1}' "artifacts/uf-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")
          SHA_MAC_X86=$(awk '{print $1}' "artifacts/uf-${VERSION}-x86_64-apple-darwin.tar.gz.sha256")
          SHA_LIN_ARM=$(awk '{print $1}' "artifacts/uf-${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256")
          SHA_LIN_X86=$(awk '{print $1}' "artifacts/uf-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256")
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "sha_mac_arm=${SHA_MAC_ARM}" >> "$GITHUB_OUTPUT"
          echo "sha_mac_x86=${SHA_MAC_X86}" >> "$GITHUB_OUTPUT"
          echo "sha_lin_arm=${SHA_LIN_ARM}" >> "$GITHUB_OUTPUT"
          echo "sha_lin_x86=${SHA_LIN_X86}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: HaomingJu/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VER="${{ steps.sha.outputs.ver }}"
          SHA_MAC_ARM="${{ steps.sha.outputs.sha_mac_arm }}"
          SHA_MAC_X86="${{ steps.sha.outputs.sha_mac_x86 }}"
          SHA_LIN_ARM="${{ steps.sha.outputs.sha_lin_arm }}"
          SHA_LIN_X86="${{ steps.sha.outputs.sha_lin_x86 }}"
          FORMULA="homebrew-tap/Formula/uf.rb"

          sed -i "s/^  version \".*\"/  version \"${VER}\"/" "$FORMULA"

          python3 - "$FORMULA" "$SHA_MAC_ARM" "$SHA_MAC_X86" "$SHA_LIN_ARM" "$SHA_LIN_X86" <<'PYEOF'
          import sys
          formula_path = sys.argv[1]
          new_shas = sys.argv[2:]
          with open(formula_path, 'r') as f:
              lines = f.readlines()
          occurrence = 0
          out = []
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith('sha256 "') and occurrence < 4:
                  indent = line[: len(line) - len(line.lstrip())]
                  out.append(f'{indent}sha256 "{new_shas[occurrence]}"\n')
                  occurrence += 1
              else:
                  out.append(line)
          with open(formula_path, 'w') as f:
              f.writelines(out)
          PYEOF

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VER="${{ steps.sha.outputs.ver }}"
          BRANCH="bump-uf-${VER}"
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/uf.rb
          git commit -m "uf ${VER}"
          git push origin "$BRANCH"
          gh pr create \
            --repo HaomingJu/homebrew-tap \
            --head "$BRANCH" \
            --base main \
            --title "uf ${VER}" \
            --body "Bump uf to ${VER}."
